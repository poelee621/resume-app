name: android-build
# Release signing secrets enabled: 2026-09-05（ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PROPERTIES）
on:
  workflow_dispatch:
  push:
    paths:
      - 'www/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (JDK 21 for compileSdk 36)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Install deps
        run: npm ci

      - name: Sync web to android
        run: npx cap sync android

      - name: Restore release keystore (from Actions secrets)
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/keys/release.p12
            printf '%s\n' "${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}" > android/keystore.properties
            echo "keystore restored ($(wc -c < android/app/keys/release.p12) bytes)"
          else
            echo "secrets missing → assembleRelease falls back to debug signing (NOT store-ready)"
          fi

      - name: Warm up Gradle distribution (retry on network reset)
        run: |
          cd android
          chmod +x gradlew
          for i in 1 2 3 4; do
            if ./gradlew --version >/dev/null 2>&1; then
              echo "gradle distribution ready"
              exit 0
            fi
            echo "gradle download failed, retry $i ..."
            sleep 15
          done
          echo "::error::无法下载 Gradle 分发包（services.gradle.org 连接被重置），请重跑 workflow"
          exit 1

      - name: Build APKs (release + debug)
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease assembleDebug --no-daemon 2>&1 | tee /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Upload Gradle build log (on failure, for diagnosis)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          retention-days: 7

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: resume-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: resume-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release (官网下载入口)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-$(date -u +%Y%m%d-%H%M%S)"
          # 有真 release 签名包则发布它（上架同款），否则回退 debug
          if [ -s android/app/keys/release.p12 ]; then
            APK="android/app/build/outputs/apk/release/app-release.apk"
            KIND="release"
          else
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
            KIND="debug"
          fi
          echo "publishing $KIND APK → $APK"
          gh release create "$TAG" \
            "$APK" \
            --repo "${{ github.repository }}" \
            --title "AI简历工坊 Android 版（$TAG · $KIND）" \
            --notes "AI简历工坊 Android 安装包（$KIND 构建）。官网下载入口：https://poelee621.github.io/resume-app/" \
            --latest 2>/dev/null || echo "release already exists"
