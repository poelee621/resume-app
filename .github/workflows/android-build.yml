name: android-build
on:
  workflow_dispatch:
  push:
    paths:
      - 'www/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (JDK 21 for compileSdk 36)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Install deps
        run: npm ci

      - name: Sync web to android
        run: npx cap sync android

      - name: Warm up Gradle distribution (retry on network reset)
        run: |
          cd android
          chmod +x gradlew
          for i in 1 2 3 4; do
            if ./gradlew --version >/dev/null 2>&1; then
              echo "gradle distribution ready"
              exit 0
            fi
            echo "gradle download failed, retry $i ..."
            sleep 15
          done
          echo "::error::无法下载 Gradle 分发包（services.gradle.org 连接被重置），请重跑 workflow"
          exit 1

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resume-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish GitHub Release (官网下载入口)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            "android/app/build/outputs/apk/debug/app-debug.apk" \
            --repo "${{ github.repository }}" \
            --title "AI简历工坊 Android 版（$TAG）" \
            --notes "AI简历工坊 Android 安装包（debug 构建）。官网下载入口：https://poelee621.github.io/resume-app/" \
            --latest 2>/dev/null || echo "release already exists"
