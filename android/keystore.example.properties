#
# ===================================================================
#   AI 简历工坊 —— release 签名配置
# -------------------------------------------------------------------
#   重要：此文件包含 PKCS#12 keystore 密码，**禁止 commit 进 git**
#   .gitignore 已排除此文件
#
#   CI 构建时改用 GitHub Secrets 注入：
#     RELEASE_STORE_FILE  (= keystore base64 解码后的文件路径)
#     RELEASE_STORE_PASSWORD
#     RELEASE_KEY_ALIAS (= "resume")
#     RELEASE_KEY_PASSWORD (= 同 storePassword)
#
#   本地首次构建会把这份模板复制成 keystore.properties
#   文件已用：~/.resume-keys/release.p12（独立备份，不在项目目录）
# ===================================================================
#

RELEASE_STORE_FILE=release.p12
RELEASE_STORE_PASSWORD=
RELEASE_KEY_ALIAS=resume
RELEASE_KEY_PASSWORD=
